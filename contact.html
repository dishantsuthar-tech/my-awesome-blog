<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Page</title>
  </head>
  <body>
    <header>
      <h1>My Awesome Blog</h1>
      <nav>
        <a href="index.html">Home</a> |
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <hr />
    <main>
      <section>
        <h2>Contact Us</h2>
        <form action="success.html" method="get">
          <div>
            <label>
              Name: <br />
              <input type="text" name="name" required />
            </label>
          </div>
          <br />
          <div>
            <label>
              Email: <br />
              <input type="email" name="email" required />
            </label>
          </div>
          <br />
          <div>
            <label>
              Phone Number: <br />
              <input
                type="tel"
                name="phone"
                required
                pattern="[0-9]{10}"
                maxlength="10"
              />
            </label>
          </div>
          <br />
          <div>
            <label>
              Message: <br />
              <textarea name="msg" cols="25" rows="4" required></textarea>
            </label>
          </div>
          <br />
          <button type="submit">Submit</button>
          <button type="reset">Clear All</button>
        </form>
      </section>
    </main>
  </body>
</html>
